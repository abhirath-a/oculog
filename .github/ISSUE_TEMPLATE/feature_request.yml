name: Feature request
description: Propose a focused improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the workflow and who it helps. Do not share personal health information.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution and alternatives
      description: Include accessibility, offline behavior, and privacy considerations where relevant.
    validations:
      required: true
