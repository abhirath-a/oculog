name: Bug report
description: Report a reproducible problem in Oculog.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, prescriptions, personal health data, or private logs. For vulnerabilities, see SECURITY.md."
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest reproducible example, starting state, and actions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, iPhone/iPad model and iOS version, Node/Python version, and development or release build. For API bugs, include the server OS.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Remove personal information and secrets before uploading.
